# Veröffentlicht die PDF Werkbank als statische Seite auf GitHub Pages (ohne Jekyll)
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Version für die Update-Anzeige stempeln
      - name: Version eintragen
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/__WB_BUILD__/$V/" js/update.js
          echo "{\"version\":\"$V\",\"built\":\"$(date -u +%FT%TZ)\"}" > version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
