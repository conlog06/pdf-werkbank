<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PDF Werkbank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Kopfzeile und Werkzeugleisten oben, Miniaturen links, Schreibtischfläche mit Seiten in der Mitte, Statuszeile unten */
:root{
  --desk:#dde1e8; --chrome:#f5f6f9; --raise:#ffffff; --line:#d1d6df; --ink:#1b2130; --muted:#5a6374;
  --accent:#1f4fd8; --accent-ink:#ffffff; --accent-soft:#e3e9fb; --danger:#c4352b;
  --paper-shadow:0 1px 2px rgb(22 28 45 / .14), 0 8px 24px rgb(22 28 45 / .10);
  --f-ui:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-display:"IBM Plex Sans Condensed", "IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#111419; --chrome:#1a1e25; --raise:#222731; --line:#303744; --ink:#e5e8ee; --muted:#99a1b0;
    --accent:#7598ff; --accent-ink:#0c1120; --accent-soft:#1f2a46; --danger:#ff7a6e;
    --paper-shadow:0 1px 2px rgb(0 0 0 / .5), 0 10px 30px rgb(0 0 0 / .45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#111419; --chrome:#1a1e25; --raise:#222731; --line:#303744; --ink:#e5e8ee; --muted:#99a1b0;
  --accent:#7598ff; --accent-ink:#0c1120; --accent-soft:#1f2a46; --danger:#ff7a6e;
  --paper-shadow:0 1px 2px rgb(0 0 0 / .5), 0 10px 30px rgb(0 0 0 / .45);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--desk);color:var(--ink);font:14px/1.4 var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{height:100%;display:grid;grid-template-rows:auto auto auto minmax(0,1fr) auto}

/* Kopfzeile */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;background:var(--chrome);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:4px}
.mark{width:26px;height:26px;flex:none}
.word{font:600 17px/1 var(--f-display);letter-spacing:.01em;white-space:nowrap}
.docname{font:12px/1.2 var(--f-mono);color:var(--muted);max-width:30ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.grow{flex:1}
.grp{display:flex;align-items:center;gap:4px}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);background:var(--raise);color:var(--ink);border-radius:6px;font:500 13px/1 var(--f-ui);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{background:var(--danger);color:#fff;border-color:transparent}
.btn:disabled{opacity:.55;cursor:progress}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:6px;color:var(--ink);cursor:pointer;flex:none}
.ibtn:hover{background:var(--accent-soft)}
.ibtn:disabled{opacity:.35;cursor:default;background:transparent}
.ibtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent)}
.ibtn.warn:hover{color:var(--danger)}
.zoomlbl{min-width:58px;height:32px;border:0;background:transparent;font:500 12px/1 var(--f-mono);color:var(--ink);cursor:pointer;border-radius:6px;font-variant-numeric:tabular-nums}
.zoomlbl:hover{background:var(--accent-soft)}
.find{display:flex;align-items:center;gap:2px;height:32px;padding:0 2px 0 8px;border:1px solid var(--line);border-radius:6px;background:var(--raise);min-width:0}
.find input{border:0;background:transparent;outline:none;width:170px;min-width:0;font-size:13px}
.find .cnt{font:11px var(--f-mono);color:var(--muted);min-width:44px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.find .ibtn{width:26px;height:26px}

/* Werkzeugleiste */
.toolbar{display:flex;align-items:center;gap:2px;padding:4px 16px;background:var(--chrome);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.vsep{width:1px;height:22px;background:var(--line);margin:0 8px;flex:none}
.tlabel{font:500 10.5px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 6px 0 2px;white-space:nowrap}

/* Eigenschaftsleiste */
.propbar{display:flex;align-items:center;gap:14px;min-height:42px;padding:5px 16px;background:var(--raise);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin;font-size:12.5px;color:var(--muted)}
.ptarget{font:600 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.prop{display:flex;align-items:center;gap:7px;white-space:nowrap}
.sw{width:20px;height:20px;border-radius:50%;border:1px solid rgb(0 0 0 / .18);cursor:pointer;padding:0;flex:none}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--raise),0 0 0 4px var(--accent)}
input[type=color]{width:26px;height:24px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--raise);cursor:pointer}
input[type=range]{accent-color:var(--accent);width:96px}
output{font:11.5px var(--f-mono);color:var(--ink);min-width:3.6em;font-variant-numeric:tabular-nums}
.field{height:28px;border:1px solid var(--line);border-radius:5px;background:var(--raise);color:var(--ink);padding:0 8px;font-size:13px}
.field.num{width:62px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.boldbtn{font-weight:700;font-family:Georgia,serif;font-size:15px}
.hint{color:var(--muted);white-space:nowrap}

/* Arbeitsfläche */
.work{display:grid;grid-template-columns:176px minmax(0,1fr);min-height:0}
.work.nothumbs{grid-template-columns:minmax(0,1fr)}
.work.nothumbs .thumbs{display:none}
.thumbs{overflow-y:auto;background:var(--chrome);border-right:1px solid var(--line);padding:14px 10px 40px;display:flex;flex-direction:column;align-items:center;gap:6px;scrollbar-width:thin}
.thumb{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:8px;cursor:pointer;width:100%}
.thumb:hover{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.thumb.sel{background:var(--accent-soft)}
.tbox{position:relative;background:#fff;box-shadow:0 0 0 1px var(--line),0 2px 6px rgb(0 0 0 / .08)}
.tbox canvas,.tbox svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.thumb.cur .tbox{box-shadow:0 0 0 2px var(--accent),0 2px 6px rgb(0 0 0 / .08)}
.tn{font:11px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.thumb.cur .tn{color:var(--accent);font-weight:500}
.thumb.db::before,.thumb.da::after{content:"";position:absolute;left:10%;right:10%;height:3px;border-radius:2px;background:var(--accent)}
.thumb.db::before{top:-2px}.thumb.da::after{bottom:-2px}

.viewer{position:relative;overflow:auto;min-width:0;min-height:0}
.pages{display:flex;flex-direction:column;align-items:center;gap:36px;padding:24px 16px 64px;width:max-content;min-width:100%}
.page{position:relative;flex:none;background:#fff;box-shadow:var(--paper-shadow);touch-action:manipulation}
.pages[data-draw] .page{touch-action:none}
.pcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.pnum{position:absolute;left:0;right:0;bottom:-24px;text-align:center;font:11px/1 var(--f-mono);color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
.pages[data-tool="select"] .page{cursor:default}
.pages[data-tool="text"] .page,.pages[data-tool="edittext"] .page{cursor:text}
.pages[data-draw] .page{cursor:crosshair}
.ov .selbox{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3;vector-effect:non-scaling-stroke}
.ov .handle{fill:#fff;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:nwse-resize}
.ov .hit{fill:#ff9f1c;fill-opacity:.28}
.ov .hit.on{fill-opacity:.55;stroke:#d97a00;stroke-width:1;vector-effect:non-scaling-stroke}
.ov .csel{fill:var(--accent);fill-opacity:.12;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.ov .chov{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:3 2;vector-effect:non-scaling-stroke}
.ov .marq{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
.pages[data-tool="objects"] .page{cursor:default}
.ted.ced{background:rgb(255 255 255 / .96);color:#1b2130;box-shadow:0 2px 10px rgb(0 0 0 / .18);border-radius:2px}
.ted{position:absolute;z-index:3;margin:0;padding:0;border:0;outline:1.5px dashed var(--accent);outline-offset:3px;background:transparent;resize:none;overflow:hidden;white-space:pre;caret-color:var(--accent)}

/* Statuszeile */
.status{display:flex;align-items:center;gap:18px;padding:6px 16px;background:var(--chrome);border-top:1px solid var(--line);font:11.5px/1.3 var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.status b{font-weight:500;color:var(--ink)}
.status .msg{margin-left:auto;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spin{width:11px;height:11px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;display:inline-block;vertical-align:-1px;margin-right:6px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

#drop{position:fixed;inset:12px;border:2px dashed var(--accent);border-radius:14px;background:color-mix(in srgb,var(--accent) 10%,transparent);display:grid;place-items:center;pointer-events:none;z-index:50;font:600 22px var(--f-display);color:var(--accent)}
#toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,8px);background:var(--ink);color:var(--chrome);padding:9px 14px;border-radius:7px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:70;max-width:calc(100% - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* Dialoge */
.modal{position:fixed;inset:0;background:rgb(8 10 16 / .5);display:grid;place-items:center;padding:16px;z-index:60}
.card{background:var(--raise);color:var(--ink);border-radius:12px;width:min(620px,100%);padding:20px;box-shadow:0 20px 60px rgb(0 0 0 / .3);display:flex;flex-direction:column;gap:14px}
.card.small{width:min(400px,100%)}
.card h2{margin:0;font:600 18px/1.2 var(--f-display)}
.card p{margin:0;color:var(--muted)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.sigpad{position:relative;background:#fff;border:1px solid var(--line);border-radius:8px;aspect-ratio:3/1;max-width:100%}
.sigpad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.sigline{position:absolute;left:7%;right:7%;top:72%;border-top:1px solid #c5cad3;pointer-events:none}
.sigline span{position:absolute;left:-2px;top:-24px;font:16px/1 var(--f-ui);color:#9aa1ad}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
.chk input{accent-color:var(--accent)}

@media (max-width:760px){
  .work{grid-template-columns:minmax(0,1fr)}
  .work .thumbs{display:none}
  .work.thumbs-open{grid-template-columns:132px minmax(0,1fr)}
  .work.thumbs-open .thumbs{display:flex}
  .btn .lbl{display:none}
  .btn{padding:0 9px}
  .docname,.tlabel{display:none}
  .find input{width:96px}
  .status .opt{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<div id="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 26 26" aria-hidden="true"><path d="M5 2.5h11l5 5v16H5z" fill="var(--accent)"/><path d="M16 2.5v5h5" fill="none" stroke="var(--chrome)" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 18.5l1.2-3.4 6-6 2.2 2.2-6 6z" fill="var(--chrome)"/></svg>
      <span class="word">PDF Werkbank</span>
      <span class="docname" id="docName" title=""></span>
    </div>
    <div class="grp">
      <button class="btn" id="btnOpen" title="PDF öffnen (Strg+O)"><i data-i="open"></i><span class="lbl">Öffnen</span></button>
      <button class="btn" id="btnMerge" title="Weitere PDFs hinten anhängen"><i data-i="add"></i><span class="lbl">Anhängen</span></button>
      <button class="btn primary" id="btnSave" title="Als PDF speichern (Strg+S)"><i data-i="save"></i><span class="lbl">Speichern</span></button>
    </div>
    <div class="grp">
      <button class="ibtn" id="btnUndo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"><i data-i="undo"></i></button>
      <button class="ibtn" id="btnRedo" title="Wiederholen (Strg+Y)" aria-label="Wiederholen"><i data-i="redo"></i></button>
    </div>
    <div class="grow"></div>
    <div class="grp">
      <button class="ibtn" id="btnZoomOut" title="Verkleinern (Strg+−)" aria-label="Verkleinern"><i data-i="zout"></i></button>
      <button class="zoomlbl" id="zoomLbl" title="Auf 100 % setzen">100 %</button>
      <button class="ibtn" id="btnZoomIn" title="Vergrößern (Strg++)" aria-label="Vergrößern"><i data-i="zin"></i></button>
      <button class="ibtn" id="btnFit" title="Seitenbreite (Strg+0)" aria-label="An Breite anpassen"><i data-i="fit"></i></button>
    </div>
    <div class="find" role="search">
      <i data-i="search" style="color:var(--muted)"></i>
      <input id="findInput" type="search" placeholder="Suchen" aria-label="Im Dokument suchen" autocomplete="off">
      <span class="cnt" id="findCount"></span>
      <button class="ibtn" id="findPrev" title="Vorheriger Treffer" aria-label="Vorheriger Treffer"><i data-i="up"></i></button>
      <button class="ibtn" id="findNext" title="Nächster Treffer" aria-label="Nächster Treffer"><i data-i="down"></i></button>
    </div>
  </header>

  <nav class="toolbar" aria-label="Werkzeuge">
    <button class="ibtn" id="btnThumbs" title="Seitenleiste ein/aus" aria-label="Seitenleiste" aria-pressed="true"><i data-i="sidebar"></i></button>
    <span class="vsep"></span>
    <button class="ibtn" data-tool="select" title="Auswählen und verschieben (V)"><i data-i="select"></i></button>
    <button class="ibtn" data-tool="objects" title="PDF-Inhalte auswählen und entfernen (M)"><i data-i="objects"></i></button>
    <button class="ibtn" data-tool="edittext" title="Text in der PDF ändern (E)"><i data-i="edittext"></i></button>
    <button class="ibtn" data-tool="text" title="Neuen Text hinzufügen (T)"><i data-i="text"></i></button>
    <button class="ibtn" data-tool="white" title="Abdecken / Schwärzen in Weiß (W)"><i data-i="white"></i></button>
    <span class="vsep"></span>
    <button class="ibtn" data-tool="pen" title="Stift (P)"><i data-i="pen"></i></button>
    <button class="ibtn" data-tool="hl" title="Markieren (H)"><i data-i="hl"></i></button>
    <button class="ibtn" data-tool="rect" title="Rechteck (R)"><i data-i="rect"></i></button>
    <button class="ibtn" data-tool="ellipse" title="Ellipse (O)"><i data-i="ellipse"></i></button>
    <button class="ibtn" data-tool="line" title="Linie (L)"><i data-i="line"></i></button>
    <button class="ibtn" data-tool="arrow" title="Pfeil (A)"><i data-i="arrow"></i></button>
    <span class="vsep"></span>
    <button class="ibtn" data-tool="check" title="Haken setzen (K)"><i data-i="check"></i></button>
    <button class="ibtn" data-tool="cross" title="Kreuz setzen (X)"><i data-i="cross"></i></button>
    <button class="ibtn" id="btnImg" title="Bild einfügen (I)"><i data-i="image"></i></button>
    <button class="ibtn" id="btnSig" title="Unterschreiben (U)"><i data-i="sign"></i></button>
    <span class="grow"></span>
    <span class="tlabel">Seiten</span>
    <button class="ibtn" id="pgRotL" title="Seite links drehen" aria-label="Seite links drehen"><i data-i="rotl"></i></button>
    <button class="ibtn" id="pgRotR" title="Seite rechts drehen" aria-label="Seite rechts drehen"><i data-i="rotr"></i></button>
    <button class="ibtn" id="pgBlank" title="Leere Seite dahinter einfügen" aria-label="Leere Seite einfügen"><i data-i="blank"></i></button>
    <button class="ibtn" id="pgExtract" title="Seite(n) als eigene PDF speichern" aria-label="Seiten extrahieren"><i data-i="extract"></i></button>
    <button class="ibtn warn" id="pgDelete" title="Seite(n) löschen" aria-label="Seite löschen"><i data-i="trash"></i></button>
  </nav>

  <div class="propbar" id="propbar" aria-label="Eigenschaften">
    <span class="ptarget" id="pTarget">Auswählen</span>
    <div class="prop" data-for="color" id="swatches"></div>
    <label class="prop" data-for="color" title="Eigene Farbe"><input type="color" id="colorPick" value="#1f4fd8" aria-label="Eigene Farbe"></label>
    <label class="prop" data-for="stroke">Stärke <input type="range" id="strokeIn" min="0.5" max="12" step="0.5"><output id="strokeOut">2 pt</output></label>
    <label class="prop" data-for="opacity">Deckkraft <input type="range" id="opIn" min="10" max="100" step="5"><output id="opOut">100 %</output></label>
    <label class="prop" data-for="font">Schrift
      <select class="field" id="fontSel"><option value="Helvetica">Helvetica</option><option value="Times">Times</option><option value="Courier">Courier</option></select>
    </label>
    <label class="prop" data-for="font"><input class="field num" type="number" id="sizeIn" min="4" max="144" step="0.5" aria-label="Schriftgröße"> pt</label>
    <button class="ibtn boldbtn" data-for="font" id="boldBtn" title="Fett" aria-label="Fett" aria-pressed="false">B</button>
    <span class="hint" id="pHint"></span>
    <span class="grow"></span>
    <button class="ibtn" id="cEditBtn" title="Text bearbeiten (Enter)" aria-label="Text bearbeiten" hidden><i data-i="edittext"></i></button>
    <button class="ibtn" id="dupBtn" title="Duplizieren (Strg+D)" aria-label="Duplizieren"><i data-i="copy"></i></button>
    <button class="ibtn warn" id="delBtn" title="Element löschen (Entf)" aria-label="Element löschen"><i data-i="trash"></i></button>
  </div>

  <main class="work" id="work">
    <aside class="thumbs" id="thumbs" aria-label="Seitenübersicht"></aside>
    <section class="viewer" id="viewer"><div class="pages" id="pages"></div></section>
  </main>

  <footer class="status">
    <span><b id="stPage">–</b></span>
    <span id="stSize"></span>
    <span class="opt" id="stCursor"></span>
    <span class="opt" id="stZoom"></span>
    <span class="msg" id="stMsg"></span>
  </footer>
</div>

<input type="file" id="fileOpen" accept="application/pdf,.pdf" hidden>
<input type="file" id="fileMerge" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="fileImg" accept="image/png,image/jpeg,image/webp,image/gif" hidden>

<div id="drop" hidden>Datei hier ablegen</div>
<div id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="askModal" hidden>
  <div class="card small" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <h2 id="askTitle">Änderungen verwerfen?</h2>
    <p id="askText"></p>
    <div class="row end"><button class="btn" id="askNo">Abbrechen</button><button class="btn danger" id="askYes">Verwerfen</button></div>
  </div>
</div>

<div class="modal" id="sigModal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
    <div class="card-head">
      <h2 id="sigTitle">Unterschrift</h2>
      <div class="seg"><button id="sigTabDraw" aria-pressed="true">Zeichnen</button><button id="sigTabType" aria-pressed="false">Tippen</button></div>
    </div>
    <div class="sigpad"><canvas id="sigCanvas"></canvas><div class="sigline"><span>×</span></div></div>
    <input class="field" id="sigText" placeholder="Deinen Namen eingeben" hidden style="height:36px">
    <div class="row">
      <div class="prop" id="sigColors"></div>
      <span class="grow"></span>
      <label class="chk"><input type="checkbox" id="sigRemember" checked> Für nächstes Mal merken</label>
    </div>
    <div class="row end">
      <button class="btn" id="sigSaved" hidden>Gespeicherte verwenden</button>
      <span class="grow"></span>
      <button class="btn" id="sigClear">Leeren</button>
      <button class="btn" id="sigCancel">Abbrechen</button>
      <button class="btn primary" id="sigOk">Einfügen</button>
    </div>
  </div>
</div>
